name: Build DEXI-OS Image

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        type: choice
        options:
          - cm5
          - ark_cm4
          - ark_cm5
          - pi5
      version:
        description: 'Version override (leave empty to use VERSION file)'
        required: false
        type: string
      bringup_ref:
        description: 'dexi_bringup ref to bake in'
        required: false
        default: 'rc/v0.22'
        type: string
      runner_label:
        description: 'Runner to dispatch to'
        required: true
        default: mac-mini-ny
        type: choice
        options:
          - mac-mini-ny
          - pi5

jobs:
  build:
    runs-on:
      - self-hosted
      - ${{ inputs.runner_label }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          [ -z "$VERSION" ] && VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "Building target=${{ inputs.target }} version=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > resources_raspberry_pi_os/build_version

      - name: Check Docker is running
        run: docker info

      # Must run before staging: the R2 copy is the first thing to need disk, so
      # a full runner fails there and never reaches the build step's own clean.
      - name: Reclaim disk and check headroom
        run: |
          echo "before: $(df -h "$RUNNER_TEMP" | tail -1)"
          rm -rf "$RUNNER_TEMP/packer-build"
          rm -f dexi_raspberry_pi_os_*.img dexi_raspberry_pi_os_*.img.zip
          rm -rf base_images
          # Stopped containers, dangling images and build cache. Tagged images
          # are kept: the packer builder lives there and re-pulling it costs
          # more than the space is worth.
          docker container prune -f || true
          docker image prune -f || true
          docker builder prune -f || true
          echo "after:  $(df -h "$RUNNER_TEMP" | tail -1)"

          # A build needs ~70 GB transient: a 30 GB working .img, a 6.1 GB zip
          # built beside it, packer's own ~30 GB unpack under RUNNER_TEMP, and
          # ~3 GB of staged assets. Stop here rather than 20 minutes in with an
          # rclone write error that says nothing about the real cause.
          FREE_GB=$(df -g "$RUNNER_TEMP" | tail -1 | awk '{print $4}')
          echo "free: ${FREE_GB} GB, need 80"
          if [ "$FREE_GB" -lt 80 ]; then
            echo "::error title=Runner out of disk::${FREE_GB} GB free, a build needs ~70 GB. Nothing this workflow owns is using it; someone needs to look at the runner."
            df -h
            du -xh -d1 "$HOME" 2>/dev/null | sort -h | tail -10
            docker system df || true
            exit 1
          fi

      - name: Stage build assets from R2
        run: |
          mkdir -p base_images resources_raspberry_pi_os
          rclone copyto r2:dexi-os-releases/build-assets/bookwork_jazzy_docker_shrinked.img.gz.xz base_images/bookwork_jazzy_docker_shrinked.img.gz.xz
          rclone copyto r2:dexi-os-releases/build-assets/dexi-droneblocks.tar resources_raspberry_pi_os/dexi-droneblocks.tar
          rclone copyto r2:dexi-os-releases/build-assets/dexi-node-red.tar resources_raspberry_pi_os/dexi-node-red.tar
          case "${{ inputs.target }}" in
            cm5)
              rclone copyto r2:dexi-os-releases/build-assets/ark_pi6x_default_v1.16.1.px4 resources_raspberry_pi_os/ark_pi6x_default_v1.16.1.px4
              ;;
            ark_cm4)
              rclone copyto r2:dexi-os-releases/build-assets/ark_pi6x_default_v1.16.2.px4 resources_raspberry_pi_os/ark_pi6x_default_v1.16.2.px4
              ;;
            ark_cm5)
              rclone copyto r2:dexi-os-releases/build-assets/ark_pi6x_default_v1.16.1.px4 resources_raspberry_pi_os/ark_pi6x_default_v1.16.1.px4
              ;;
            pi5)
              echo "pi5 target: no PX4 firmware needed"
              ;;
          esac
          ls -lh base_images/ resources_raspberry_pi_os/dexi-*.tar
          ls -lh resources_raspberry_pi_os/*.px4 2>/dev/null || true

      - name: Build image
        run: |
          # packer unpacks the ~14 GB base image into this directory. It is the
          # container's /tmp, so nothing inside the container removes it, and
          # until now neither did cleanup: nine builds in one evening filled the
          # runner and every target failed with "No space left on device".
          # Clear it going in as well as on the way out, so a runner that is
          # already full recovers on the next run instead of needing a human.
          rm -rf "$RUNNER_TEMP/packer-build"
          mkdir -p "$RUNNER_TEMP/packer-build"
          df -h "$RUNNER_TEMP" | tail -1
          docker run --rm --privileged \
            -v /dev:/dev \
            -v ${PWD}:/build \
            -v ${PWD}/base_images:/build/base_images \
            -v "$RUNNER_TEMP/packer-build:/tmp" \
            mkaczanowski/packer-builder-arm:latest build \
              -var "target=${{ inputs.target }}" \
              -var "bringup_ref=${{ inputs.bringup_ref || 'rc/v0.22' }}" \
              ./raspberry_pi_os.pkr.hcl

      - name: Compress image
        run: |
          IMG="dexi_raspberry_pi_os_${{ inputs.target }}.img"
          zip -1 "${IMG}.zip" "$IMG"
          ls -lh "${IMG}.zip"
          # Drop the 30 GB working image now. It is not needed again, and the
          # upload below is the longest step in the job to be holding it for.
          rm -f "$IMG"
          df -h "$RUNNER_TEMP" | tail -1

      - name: Upload to R2
        run: |
          IMG="dexi_raspberry_pi_os_${{ inputs.target }}.img.zip"
          rclone copyto "$IMG" \
            r2:dexi-os-releases/${{ steps.version.outputs.version }}/$IMG \
            --s3-chunk-size 64M --s3-upload-concurrency 8

      - name: Print download URL
        run: |
          IMG="dexi_raspberry_pi_os_${{ inputs.target }}.img.zip"
          echo "::notice title=Image published::https://pub-7efc16585b2a4b5ab550489e8d8d5b33.r2.dev/${{ steps.version.outputs.version }}/$IMG"

      - name: Cleanup local artifacts
        if: always()
        run: |
          rm -f dexi_raspberry_pi_os_*.img.zip
          rm -f dexi_raspberry_pi_os_*.img
          rm -rf base_images
          rm -f resources_raspberry_pi_os/dexi-*.tar
          rm -f resources_raspberry_pi_os/*.px4
          rm -f resources_raspberry_pi_os/build_version
          rm -rf "$RUNNER_TEMP/packer-build"
          echo "end:    $(df -h "$RUNNER_TEMP" | tail -1)"
